<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Consumo Consciente</title>
<meta name="description" content="Simulador de consumo de energia offline, com 4.998 equipamentos, gráficos e relatórios." />
<meta name="theme-color" content="#08080a" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Consumo" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <div class="topbar-title">
      <h1 id="pageTitle">Consumo Consciente</h1>
      <p id="pageSubtitle">Carregando…</p>
    </div>
    <button class="icon-btn" id="installBtn" title="Instalar aplicativo" aria-label="Instalar aplicativo">
      <svg class="mi"><use href="assets/icons.svg#download"></use></svg>
    </button>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="tab active">
      <svg class="mi"><use href="assets/icons.svg#home"></use></svg>
      <span>Início</span>
    </button>
    <button data-tab="environments" class="tab">
      <svg class="mi"><use href="assets/icons.svg#meeting_room"></use></svg>
      <span>Ambientes</span>
    </button>
    <button data-tab="equipment" class="tab">
      <svg class="mi"><use href="assets/icons.svg#electrical_services"></use></svg>
      <span>Aparelhos</span>
    </button>
    <button data-tab="simulate" class="tab">
      <svg class="mi"><use href="assets/icons.svg#trending_up"></use></svg>
      <span>Simular</span>
    </button>
    <button data-tab="settings" class="tab">
      <svg class="mi"><use href="assets/icons.svg#settings"></use></svg>
      <span>Ajustes</span>
    </button>
  </nav>
</div>

<div class="modal-root" id="modalRoot" aria-hidden="true"></div>

<section id="printArea" class="print-only"></section>

<script src="app.js"></script>
</body>
</html>
