<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Consumo Consciente</title>
<meta name="description" content="Simulador de consumo de energia offline, com 4.998 equipamentos, gráficos e relatórios." />
<meta name="theme-color" content="#08080a" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Consumo" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <div class="topbar-title">
      <h1 id="pageTitle">Consumo Consciente</h1>
      <p id="pageSubtitle">Carregando…</p>
    </div>
    <button class="icon-btn" id="installBtn" hidden title="Instalar aplicativo" aria-label="Instalar aplicativo">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3v10.6l3.3-3.3 1.4 1.4L11 17.4 5.3 11.7l1.4-1.4L10 13.6V3zM5 19h14v2H5z"/></svg>
    </button>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="tab active">
      <svg viewBox="0 0 24 24"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg>
      <span>Início</span>
    </button>
    <button data-tab="environments" class="tab">
      <svg viewBox="0 0 24 24"><path d="M4 3h16v18H4zm3 3v4h4V6zm6 0v4h4V6zM7 13v4h4v-4zm6 0v4h4v-4z"/></svg>
      <span>Ambientes</span>
    </button>
    <button data-tab="equipment" class="tab">
      <svg viewBox="0 0 24 24"><path d="M9 2h6v3h5v17H4V5h5zm2 3v2h2V5zm-3 6v2h8v-2zm0 4v2h8v-2z"/></svg>
      <span>Aparelhos</span>
    </button>
    <button data-tab="simulate" class="tab">
      <svg viewBox="0 0 24 24"><path d="M4 18h3v3H4zm6-6h3v9h-3zm6-8h3v17h-3z"/></svg>
      <span>Simular</span>
    </button>
    <button data-tab="settings" class="tab">
      <svg viewBox="0 0 24 24"><path d="m19.4 13 .1-1-.1-1 2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L15 3h-4l-.3 2.6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6-.1 1 .1 1-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1L11 21h4l.3-2.6a7 7 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>
</div>

<div class="modal-root" id="modalRoot" aria-hidden="true"></div>

<section id="printArea" class="print-only"></section>

<script src="app.js"></script>
</body>
</html>
